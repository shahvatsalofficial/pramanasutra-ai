<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How supplied test results are classified</title><desc id="d">Five evidence states: absent, failing, inconclusive, unverified and passing, and the gate effect of each.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3bba9"/></marker></defs>
<rect x="1" y="1" width="958" height="418" rx="16" fill="#1a201d" stroke="#3b4740" stroke-width="2"/>
<text x="30" y="32" font-size="12" font-weight="700" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="30" dy="0">WHAT YOU SUPPLY</tspan></text>
<text x="490" y="32" font-size="12" font-weight="700" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="490" dy="0">STATE</tspan></text>
<text x="930" y="32" font-size="12" font-weight="700" fill="#c3bba9" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="930" dy="0">GATE EFFECT</tspan></text>
<rect x="30" y="50" width="360" height="58" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="46" y="85" font-size="14.5" font-weight="400" fill="#f3efe6" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="46" dy="0">No --evidence file</tspan></text>
<rect x="415" y="65" width="150" height="28" rx="14" fill="#26302c" stroke="#3b4740" stroke-width="1.4"/><text x="490" y="83.9" font-size="14" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="490" dy="0">absent</tspan></text>
<polyline points="390,79 415,79" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="565,79 640,79" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
