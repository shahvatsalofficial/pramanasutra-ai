<rect x="1" y="1" width="958" height="328" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<rect x="330" y="20" width="300" height="60" rx="12" fill="#dff0ee" stroke="#0b5f63" stroke-width="1.6"/><text x="480" y="54.8" font-size="16" font-weight="700" fill="#0f3d3e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">What are you trying to do?</tspan></text>
<polyline points="480,80 480,110 127,110 127,150" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
