<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How the release gate decides</title><desc id="d">Flowchart. A blocking finding or failing evidence gives NO_GO. Missing evidence, a partial scan, no tests, no CI or no license gives REVIEW_REQUIRED. Only when nothing is missing is the result READY_FOR_HUMAN_APPROVAL, which still needs a person.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3bba9"/></marker></defs>
<rect x="1" y="1" width="958" height="798" rx="16" fill="#1a201d" stroke="#3b4740" stroke-width="2"/>
<rect x="370" y="26" width="220" height="28" rx="14" fill="#26302c" stroke="#3b4740" stroke-width="1.4"/><text x="480" y="44.9" font-size="14" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">release-check runs</tspan></text>
<polyline points="480,54 480,92" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="480,95 630,160 480,225 330,160" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="480" y="158" font-size="16" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">Blocking finding?</tspan></text><text x="480" y="178" font-size="12.5" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">e.g. a focused test (.only)</tspan></text>
<polyline points="630,160 720,160" fill="none" stroke="#fca5a5" stroke-width="2" marker-end="url(#ah)"/><text x="675" y="150" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="675" dy="0">yes</tspan></text>
<rect x="720" y="120" width="215" height="80" rx="12" fill="#3b1a1a" stroke="#fca5a5" stroke-width="1.6"/><text x="827.5" y="147.25" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="827.5" dy="0">NO_GO</tspan></text><text x="827.5" y="168.05" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="827.5" dy="0">exit code 2</tspan><tspan x="827.5" dy="17.6">fix, then re-check</tspan></text>
<polyline points="480,225 480,275" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#ah)"/><text x="497" y="252" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="497" dy="0">no</tspan></text>
<polygon points="480,275 630,340 480,405 330,340" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="480" y="338" font-size="16" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">Evidence failing?</tspan></text><text x="480" y="358" font-size="12.5" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">failures, or exit code not 0</tspan></text>
<polyline points="630,340 700,340 700,170 720,170" fill="none" stroke="#fca5a5" stroke-width="2" marker-end="url(#ah)"/><text x="665" y="330" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="665" dy="0">yes</tspan></text>
<polyline points="480,405 480,455" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#ah)"/><text x="497" y="432" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="497" dy="0">no</tspan></text>
<polygon points="480,455 630,520 480,585 330,520" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="480" y="518" font-size="16" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">Anything missing?</tspan></text><text x="480" y="538" font-size="12.5" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">see the list on the right</tspan></text>
<polyline points="630,520 720,520" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)"/><text x="675" y="510" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="675" dy="0">yes</tspan></text>
<rect x="720" y="430" width="215" height="180" rx="12" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.6"/><text x="827.5" y="471.85" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="827.5" dy="0">REVIEW_REQUIRED</tspan></text><text x="827.5" y="491.35" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="827.5" dy="0">exit code 3</tspan><tspan x="827.5" dy="17.6"></tspan><tspan x="827.5" dy="17.6">Missing when:</tspan><tspan x="827.5" dy="17.6">evidence is not passing</tspan><tspan x="827.5" dy="17.6">scan is partial</tspan><tspan x="827.5" dy="17.6">no tests, CI or license</tspan></text>
<polyline points="480,585 480,645" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#ah)"/><text x="497" y="620" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="497" dy="0">no</tspan></text>
<rect x="310" y="645" width="340" height="70" rx="12" fill="#12301d" stroke="#86efac" stroke-width="1.6"/><text x="480" y="676.0250000000001" font-size="16" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">READY_FOR_HUMAN_APPROVAL</tspan></text><text x="480" y="696.825" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">exit code 0</tspan></text>
<polyline points="480,715 480,745" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="315" y="751" width="330" height="28" rx="14" fill="#12301d" stroke="#86efac" stroke-width="1.4"/><text x="480" y="769.9" font-size="14" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">A person reviews and decides</tspan></text>
<text x="30" y="225" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="30" dy="0">Checked in this order.</tspan><tspan x="30" dy="16.9">First match wins.</tspan></text>
<rect x="30" y="600" width="230" height="120" rx="12" fill="#26302c" stroke="#3b4740" stroke-width="1.6"/><text x="145" y="639.4875000000001" font-size="16" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="145" dy="0">Always true</tspan></text><text x="145" y="660.2875" font-size="12.5" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="145" dy="0">requiresHumanApproval: true</tspan><tspan x="145" dy="16.9">automatedDeploymentAuthorized:</tspan><tspan x="145" dy="16.9">false</tspan></text>
</svg>
