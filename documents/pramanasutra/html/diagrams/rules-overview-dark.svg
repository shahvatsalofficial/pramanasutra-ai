<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The five static rules</title><desc id="d">FOCUSED_TEST is high and blocks. SKIPPED_TEST is low and blocks only under the strict policy. NO_TESTS, NO_CI and NO_LICENSE are medium or low and require review.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3bba9"/></marker></defs>
<rect x="1" y="1" width="958" height="398" rx="16" fill="#1a201d" stroke="#3b4740" stroke-width="2"/>
<text x="30" y="32" font-size="12" font-weight="700" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="30" dy="0">RULE</tspan></text>
<text x="300" y="32" font-size="12" font-weight="700" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="300" dy="0">SEVERITY</tspan></text>
<text x="430" y="32" font-size="12" font-weight="700" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="430" dy="0">WHAT IT SEES</tspan></text>
<text x="930" y="32" font-size="12" font-weight="700" fill="#c3bba9" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="930" dy="0">GATE EFFECT</tspan></text>
<rect x="20" y="46" width="920" height="56" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="36" y="80" font-size="15.5" font-weight="700" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="36" dy="0">FOCUSED_TEST</tspan></text>
<rect x="250" y="60" width="100" height="28" rx="14" fill="#3b1a1a" stroke="#fca5a5" stroke-width="1.4"/><text x="300" y="78.55" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="300" dy="0">high</tspan></text>
<text x="430" y="79" font-size="13.5" font-weight="400" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="430" dy="0">test.only, fit, fdescribe</tspan></text>
<rect x="675" y="60" width="250" height="28" rx="14" fill="#3b1a1a" stroke="#fca5a5" stroke-width="1.4"/><text x="800" y="78.375" font-size="12.5" font-weight="700" fill="#fca5a5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="800" dy="0">NO_GO</tspan></text>
<rect x="20" y="114" width="920" height="56" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="36" y="148" font-size="15.5" font-weight="700" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="36" dy="0">SKIPPED_TEST</tspan></text>
<rect x="250" y="128" width="100" height="28" rx="14" fill="#26302c" stroke="#3b4740" stroke-width="1.4"/><text x="300" y="146.55" font-size="13" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="300" dy="0">low</tspan></text>
<text x="430" y="147" font-size="13.5" font-weight="400" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="430" dy="0">.skip, xit, @Disabled, t.Skip</tspan></text>
<rect x="675" y="128" width="250" height="28" rx="14" fill="#26302c" stroke="#3b4740" stroke-width="1.4"/><text x="800" y="146.375" font-size="12.5" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="800" dy="0">NO_GO under strict policy only</tspan></text>
<rect x="20" y="182" width="920" height="56" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="36" y="216" font-size="15.5" font-weight="700" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="36" dy="0">NO_TESTS</tspan></text>
<rect x="250" y="196" width="100" height="28" rx="14" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.4"/><text x="300" y="214.55" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="300" dy="0">medium</tspan></text>
<text x="430" y="215" font-size="13.5" font-weight="400" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="430" dy="0">no file looks like a test</tspan></text>
<rect x="675" y="196" width="250" height="28" rx="14" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.4"/><text x="800" y="214.375" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="800" dy="0">REVIEW_REQUIRED</tspan></text>
<rect x="20" y="250" width="920" height="56" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="36" y="284" font-size="15.5" font-weight="700" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="36" dy="0">NO_CI</tspan></text>
<rect x="250" y="264" width="100" height="28" rx="14" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.4"/><text x="300" y="282.55" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="300" dy="0">medium</tspan></text>
<text x="430" y="283" font-size="13.5" font-weight="400" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="430" dy="0">no recognised pipeline file</tspan></text>
<rect x="675" y="264" width="250" height="28" rx="14" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.4"/><text x="800" y="282.375" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="800" dy="0">REVIEW_REQUIRED</tspan></text>
<rect x="20" y="318" width="920" height="56" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="36" y="352" font-size="15.5" font-weight="700" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="36" dy="0">NO_LICENSE</tspan></text>
<rect x="250" y="332" width="100" height="28" rx="14" fill="#26302c" stroke="#3b4740" stroke-width="1.4"/><text x="300" y="350.55" font-size="13" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="300" dy="0">low</tspan></text>
<text x="430" y="351" font-size="13.5" font-weight="400" fill="#c3bba9" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="430" dy="0">no LICENSE at the root</tspan></text>
<rect x="675" y="332" width="250" height="28" rx="14" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.4"/><text x="800" y="350.375" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="800" dy="0">REVIEW_REQUIRED</tspan></text>
<text x="480" y="390" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">Rules read test files only, line by line. They are heuristics, not parsers.</tspan></text>
</svg>
