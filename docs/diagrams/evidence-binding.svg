<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Evidence binding: three honest labels</title><desc id="d">Binding is none when no evidence file is given, unbound when the file names no GitHub run, and ci-environment when it names a repository, commit, run id and workflow. None of these is a signature.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e584e"/></marker></defs>
<rect x="1" y="1" width="958" height="298" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<rect x="20" y="40" width="280" height="150" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/><text x="160" y="103.45" font-size="20" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="160" dy="0">none</tspan></text><text x="160" y="129.45" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="160" dy="0">no evidence file</tspan><tspan x="160" dy="17.6">nothing to bind</tspan></text>
<rect x="340" y="40" width="280" height="150" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="1.6"/><text x="480" y="103.45" font-size="20" font-weight="700" fill="#92400e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">unbound</tspan></text><text x="480" y="129.45" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">a file, but no GitHub identity</tspan><tspan x="480" dy="17.6">anyone could have typed it</tspan></text>
<rect x="660" y="40" width="280" height="150" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="800" y="103.45" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="800" dy="0">ci-environment</tspan></text><text x="800" y="129.45" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="800" dy="0">repository, commit, run id</tspan><tspan x="800" dy="17.6">and workflow are named</tspan></text>
<polyline points="300,115 340,115" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="620,115 660,115" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<text x="480" y="225" font-size="14" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">More claims as you move right.</tspan></text>
<text x="480" y="252" font-size="13.5" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">No label is a cryptographic signature. A person can still hand-write a ci-environment file.</tspan></text>
</svg>
