<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The 17 agent skills</title><desc id="d">PramanaSutra Prime is the chief orchestrator. Sixteen specialist skills are grouped into plan, write tests, investigate, and ship and verify.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e584e"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<rect x="335" y="215" width="290" height="90" rx="12" fill="#dff0ee" stroke="#0b5f63" stroke-width="1.6"/><text x="480" y="247.85" font-size="18" font-weight="700" fill="#0f3d3e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">pramanasutra-prime</tspan></text><text x="480" y="271.25" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">chief orchestrator</tspan><tspan x="480" dy="17.6">scope, safety, delegation</tspan></text>
<rect x="30" y="20" width="400" height="150" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="230" y="73.475" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">Plan</tspan></text><text x="230" y="94.27499999999999" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">pramanasutra-strategy</tspan><tspan x="230" dy="17.6">risk-based test strategy</tspan><tspan x="230" dy="17.6">coverage objectives</tspan></text>
<rect x="530" y="20" width="400" height="150" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="730" y="73.475" font-size="16" font-weight="700" fill="#166534" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">Write and design tests</tspan></text><text x="730" y="94.27499999999999" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">-unit  -flow  -api  -visual</tspan><tspan x="730" dy="17.6">-access  -load  -data</tspan><tspan x="730" dy="17.6">one skill per kind of test</tspan></text>
<rect x="30" y="350" width="400" height="150" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="1.6"/><text x="230" y="403.47499999999997" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">Investigate</tspan></text><text x="230" y="424.275" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">-regression  what changed</tspan><tspan x="230" dy="17.6">-flake  why it is unstable</tspan><tspan x="230" dy="17.6">-defect  failure to bug report</tspan></text>
<rect x="530" y="350" width="400" height="150" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/><text x="730" y="403.47499999999997" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">Ship and verify</tspan></text><text x="730" y="424.275" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">-pipeline  -release  -secure</tspan><tspan x="730" dy="17.6">-evidence  -verify</tspan><tspan x="730" dy="17.6">verify reviews the evidence</tspan></text>
