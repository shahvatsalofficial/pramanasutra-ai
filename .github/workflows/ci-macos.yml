name: CI macOS
# Separate from CI on purpose. On 2026-11-04 the macOS jobs in the main matrix sat in the
# GitHub queue and were cancelled with zero steps (run 41884015367). That is a runner
# outage, not a test failure. A green run here is real evidence. A cancelled queue is not,
# and it must not fail the required CI badge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node packages/cli/bin/pramanasutra.mjs doctor
      - name: Release gate on this repo, using the test run as evidence
        run: node scripts/ci-gate.mjs
