<rect x="255" y="262" width="215" height="48" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/><text x="362.5" y="290.5" font-size="15" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="362.5" dy="0">Stories 2, 5</tspan></text>
<polyline points="480,80 480,110 597,110 597,150" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
