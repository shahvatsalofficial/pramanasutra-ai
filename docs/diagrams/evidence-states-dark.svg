<rect x="30" y="122" width="360" height="58" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="46" y="157" font-size="14.5" font-weight="400" fill="#f3efe6" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="46" dy="0">failed above 0, or exit code not 0</tspan></text>
<rect x="415" y="137" width="150" height="28" rx="14" fill="#3b1a1a" stroke="#fca5a5" stroke-width="1.4"/><text x="490" y="155.9" font-size="14" font-weight="700" fill="#fca5a5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="490" dy="0">failing</tspan></text>
