<text x="480" y="340" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">Skills are instructions your IDE model follows. They do not run tests.</tspan></text>
