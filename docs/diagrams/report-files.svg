<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">One audit, four files</title><desc id="d">One scan writes report.md for pull requests, report.html for browsers, report.json for tools and report.sarif.json for code scanning. The facts are the same in all four.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e584e"/></marker></defs>
<rect x="1" y="1" width="958" height="378" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<rect x="30" y="120" width="240" height="130" rx="12" fill="#dff0ee" stroke="#0b5f63" stroke-width="1.6"/><text x="150" y="172.85" font-size="18" font-weight="700" fill="#0f3d3e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="150" dy="0">One scan</tspan></text><text x="150" y="196.25" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="150" dy="0">one set of facts</tspan><tspan x="150" dy="17.6">written four ways</tspan></text>
<rect x="350" y="20" width="580" height="70" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/>
<text x="375" y="50" font-size="17" font-weight="700" fill="#1e40af" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="375" dy="0">report.md</tspan></text>
<text x="375" y="72" font-size="14" font-weight="400" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="375" dy="0">Pull requests, tickets, plain reading</tspan></text>
<polyline points="270,185 310,185 310,55 350,55" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="350" y="110" width="580" height="70" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/>
<text x="375" y="140" font-size="17" font-weight="700" fill="#166534" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="375" dy="0">report.html</tspan></text>
<text x="375" y="162" font-size="14" font-weight="400" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="375" dy="0">Open in a browser. Share or print. Light and dark.</tspan></text>
<polyline points="270,185 310,185 310,145 350,145" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="350" y="200" width="580" height="70" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/>
<text x="375" y="230" font-size="17" font-weight="700" fill="#1c1915" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="375" dy="0">report.json</tspan></text>
<text x="375" y="252" font-size="14" font-weight="400" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="375" dy="0">Scripts and CI. Stable schema 1.0.0.</tspan></text>
<polyline points="270,185 310,185 310,235 350,235" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="350" y="290" width="580" height="70" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="1.6"/>
<text x="375" y="320" font-size="17" font-weight="700" fill="#92400e" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="375" dy="0">report.sarif.json</tspan></text>
<text x="375" y="342" font-size="14" font-weight="400" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="375" dy="0">SARIF 2.1.0 for code scanning. Not uploaded for you.</tspan></text>
<polyline points="270,185 310,185 310,325 350,325" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
</svg>
