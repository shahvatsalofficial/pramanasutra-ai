<polyline points="565,151 640,151" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="640" y="122" width="290" height="58" rx="12" fill="#3b1a1a" stroke="#fca5a5" stroke-width="1.6"/><text x="785" y="155.5" font-size="15" font-weight="700" fill="#fca5a5" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="785" dy="0">NO_GO</tspan></text>
<rect x="30" y="194" width="360" height="58" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
