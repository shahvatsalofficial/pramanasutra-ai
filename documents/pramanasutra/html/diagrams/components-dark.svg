<polyline points="480,90 480,130 860,130 860,170" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="330" width="700" height="80" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/><text x="370" y="365.575" font-size="14.5" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="370" dy="0">Zero runtime dependencies. Node standard library only. No network.</tspan></text><text x="370" y="384.425" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="370" dy="0">Runs git diff --name-only (read-only) only when you pass --changed</tspan></text>
<rect x="740" y="330" width="200" height="80" rx="12" fill="#26302c" stroke="#3b4740" stroke-width="1.6"/><text x="840" y="365.575" font-size="14.5" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="840" dy="0">.agents/skills</tspan></text><text x="840" y="384.425" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="840" dy="0">17 SKILL.md sources</tspan></text>
<polyline points="860,330 860,280" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
