<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Which story is yours?</title><desc id="d">A decision guide: stop a release with a hidden problem, stories 1, 4 and 6; check a claim that tests pass, stories 2 and 5; make every pull request prove itself, story 3; teach an AI assistant the method, story 8.</desc>
