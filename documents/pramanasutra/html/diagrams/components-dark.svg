<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Inside the CLI</title><desc id="d">The bin file parses arguments and sets the exit code. It calls the scanner, the evidence and policy loaders and the report writer, and the installer copies skills into IDE folders.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3bba9"/></marker></defs>
<rect x="1" y="1" width="958" height="428" rx="16" fill="#1a201d" stroke="#3b4740" stroke-width="2"/>
<rect x="280" y="20" width="400" height="70" rx="12" fill="#173735" stroke="#5fb9b2" stroke-width="1.6"/><text x="480" y="51.025000000000006" font-size="16" font-weight="700" fill="#a8e3dc" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="480" dy="0">bin/pramanasutra.mjs</tspan></text><text x="480" y="71.825" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">parse arguments, dispatch, exit code</tspan></text>
<rect x="20" y="170" width="160" height="110" rx="12" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="100" y="211.8" font-size="14.5" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="100" dy="0">scanner.mjs</tspan></text><text x="100" y="230.65" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="100" dy="0">walk files, 5 rules</tspan><tspan x="100" dy="17.6">evaluateGate</tspan></text>
<polyline points="480,90 480,130 100,130 100,170" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="210" y="170" width="160" height="110" rx="12" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="290" y="211.8" font-size="14.5" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="290" dy="0">evidence.mjs</tspan></text><text x="290" y="230.65" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="290" dy="0">validate JSON</tspan><tspan x="290" dy="17.6">classify state</tspan></text>
<polyline points="480,90 480,130 290,130 290,170" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
