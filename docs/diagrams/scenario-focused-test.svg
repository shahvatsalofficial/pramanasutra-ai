<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Scenario: a focused test hides half the suite</title><desc id="d">A test.only on line 2 means the runner executes 1 of 2 tests and still shows green. PramanaSutra reports FOCUSED_TEST at tests/a.test.js:2 and returns NO_GO with exit code 2. After the fix, 2 of 2 run.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e584e"/></marker></defs>
<rect x="1" y="1" width="958" height="418" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<text x="30" y="32" font-size="14" font-weight="700" fill="#991b1b" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="30" dy="0">BEFORE: green build, half the coverage</tspan></text>
<rect x="30" y="48" width="420" height="108" rx="10" fill="#1b2423"/>
<text x="46" y="78" font-size="13.5" font-weight="400" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="46" dy="0">import { test } from &quot;node:test&quot;;</tspan></text>
<rect x="30" y="88" width="420" height="26" fill="#7f1d1d"/>
<text x="46" y="106" font-size="13.5" font-weight="400" fill="#fecaca" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="46" dy="0">test.only(&quot;only this runs&quot;, () =&gt; {});</tspan></text>
<text x="46" y="134" font-size="13.5" font-weight="400" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="46" dy="0">test(&quot;silently skipped&quot;, () =&gt; {});</tspan></text>
<text x="14" y="106" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="14" dy="0">2</tspan></text>
<text x="30" y="186" font-size="13" font-weight="400" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="30" dy="0">Tests the runner executes</tspan></text>
<rect x="30" y="196" width="420" height="22" rx="6" fill="#efeae0"/><rect x="30" y="196" width="210" height="22" rx="6" fill="#991b1b"/>
<text x="125" y="213" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="125" dy="0">1 of 2 run</tspan></text>
<polyline points="250,232 250,262" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="30" y="266" width="420" height="120" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6"/><text x="240" y="304.175" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="240" dy="0">PramanaSutra: NO_GO (exit 2)</tspan></text><text x="240" y="323.675" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="240" dy="0">FOCUSED_TEST  high</tspan><tspan x="240" dy="17.6">tests/a.test.js:2</tspan><tspan x="240" dy="17.6">Remove .only, run the full suite</tspan></text>
<polyline points="450,130 510,130" fill="none" stroke="#166534" stroke-width="2" marker-end="url(#ah)"/><text x="480" y="120" font-size="13" font-weight="700" fill="#166534" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">fix</tspan></text>
<text x="510" y="32" font-size="14" font-weight="700" fill="#166534" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="510" dy="0">AFTER: full suite runs, evidence supplied</tspan></text>
<rect x="510" y="48" width="420" height="108" rx="10" fill="#1b2423"/>
<text x="526" y="78" font-size="13.5" font-weight="400" fill="#f3efe6" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="526" dy="0">import { test } from &quot;node:test&quot;;</tspan></text>
<text x="526" y="106" font-size="13.5" font-weight="400" fill="#bbf7d0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="526" dy="0">test(&quot;only this runs&quot;, () =&gt; {});</tspan></text>
<text x="526" y="134" font-size="13.5" font-weight="400" fill="#bbf7d0" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace"><tspan x="526" dy="0">test(&quot;no longer skipped&quot;, () =&gt; {});</tspan></text>
<text x="510" y="186" font-size="13" font-weight="400" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="510" dy="0">Tests the runner executes</tspan></text>
<rect x="510" y="196" width="420" height="22" rx="6" fill="#166534"/>
<text x="720" y="213" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="720" dy="0">2 of 2</tspan></text>
<polyline points="720,232 720,262" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="510" y="266" width="420" height="120" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="720" y="304.175" font-size="15" font-weight="700" fill="#166534" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="720" dy="0">READY_FOR_HUMAN_APPROVAL (exit 0)</tspan></text><text x="720" y="323.675" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="720" dy="0">with passing evidence supplied</tspan><tspan x="720" dy="17.6">and no other blocker</tspan><tspan x="720" dy="17.6">a person still approves</tspan></text>
</svg>
