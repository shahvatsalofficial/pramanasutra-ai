<polyline points="127,230 127,262" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="262" width="215" height="48" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="127.5" y="290.5" font-size="15" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="127.5" dy="0">Stories 1, 4, 6</tspan></text>
<polyline points="480,80 480,110 362,110 362,150" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="255" y="150" width="215" height="80" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="1.6"/><text x="362.5" y="194.04999999999998" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="362.5" dy="0">Check a claim that tests pass</tspan></text>
<polyline points="362,230 362,262" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="255" y="262" width="215" height="48" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="362.5" y="290.5" font-size="15" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="362.5" dy="0">Stories 2, 5</tspan></text>
<polyline points="480,80 480,110 597,110 597,150" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="490" y="150" width="215" height="80" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="597.5" y="194.04999999999998" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="597.5" dy="0">Make every pull request prove itself</tspan></text>
