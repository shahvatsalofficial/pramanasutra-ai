<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">How PramanaSutra AI works</title><desc id="d">Your project files, your test results and an optional policy go into the pramanasutra command. It scans, checks the evidence and decides a gate. It writes four report files and an exit code, and a person makes the final call.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e584e"/></marker></defs>
<rect x="1" y="1" width="958" height="428" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<text x="30" y="30" font-size="12" font-weight="700" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="30" dy="0">YOU PROVIDE</tspan></text>
<text x="340" y="30" font-size="12" font-weight="700" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="340" dy="0">THE CLI DECIDES (OFFLINE, NO NETWORK)</tspan></text>
<text x="680" y="30" font-size="12" font-weight="700" fill="#5e584e" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="680" dy="0">YOU GET</tspan></text>
<rect x="30" y="45" width="250" height="90" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/><text x="155" y="86.025" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">Your project files</tspan></text><text x="155" y="106.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">read-only, never executed</tspan></text>
<rect x="30" y="170" width="250" height="90" rx="12" fill="#dff0ee" stroke="#0b5f63" stroke-width="1.6"/><text x="155" y="211.02499999999998" font-size="16" font-weight="700" fill="#0f3d3e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">Test results (evidence)</tspan></text><text x="155" y="231.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">JSON from your own runner or CI</tspan></text>
<rect x="30" y="295" width="250" height="80" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/><text x="155" y="331.025" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">Policy (optional)</tspan></text><text x="155" y="351.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">fail-closed JSON</tspan></text>
<rect x="335" y="45" width="280" height="330" rx="14" fill="#ffffff" stroke="#0b5f63" stroke-width="2"/>
<rect x="355" y="62" width="240" height="80" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="475" y="98.025" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="475" dy="0">1  Scan</tspan></text><text x="475" y="118.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="475" dy="0">5 static rules, file and line</tspan></text>
<rect x="355" y="160" width="240" height="80" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="475" y="196.02499999999998" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="475" dy="0">2  Check evidence</tspan></text><text x="475" y="216.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="475" dy="0">shape, state, binding label</tspan></text>
<rect x="355" y="258" width="240" height="100" rx="12" fill="#dff0ee" stroke="#0b5f63" stroke-width="1.6"/><text x="475" y="295.25" font-size="16" font-weight="700" fill="#0f3d3e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="475" dy="0">3  Gate</tspan></text><text x="475" y="316.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="475" dy="0">apply policy to findings</tspan><tspan x="475" dy="17.6">and evidence</tspan></text>
<polyline points="280,90 310,90 310,102 355,102" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="280,215 355,200" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="280,335 310,335 310,318 355,318" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="615,120 680,120" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="615,300 680,300" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="680" y="45" width="250" height="150" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="805" y="89.7" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">Four report files</tspan></text><text x="805" y="110.5" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">report.md</tspan><tspan x="805" dy="17.6">report.html</tspan><tspan x="805" dy="17.6">report.json</tspan><tspan x="805" dy="17.6">report.sarif.json</tspan></text>
<rect x="680" y="225" width="250" height="70" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="805" y="256.025" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">Exit code</tspan></text><text x="805" y="276.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">0 ready   2 NO_GO   3 review</tspan></text>
<rect x="680" y="320" width="250" height="70" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="805" y="351.025" font-size="16" font-weight="700" fill="#166534" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">A person decides</tspan></text><text x="805" y="371.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">never an automatic deploy</tspan></text>
<polyline points="805,295 805,320" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<text x="480" y="412" font-size="13.5" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">The tool never runs your tests. It reads files and reads the results you hand it.</tspan></text>
</svg>
