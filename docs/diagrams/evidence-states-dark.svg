<polyline points="565,223 640,223" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="640" y="194" width="290" height="58" rx="12" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.6"/><text x="785" y="227.5" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="785" dy="0">REVIEW_REQUIRED</tspan></text>
<rect x="30" y="266" width="360" height="58" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="46" y="301" font-size="14.5" font-weight="400" fill="#f3efe6" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="46" dy="0">source is external-unverified</tspan></text>
<rect x="415" y="281" width="150" height="28" rx="14" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.4"/><text x="490" y="299.9" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="490" dy="0">unverified</tspan></text>
<polyline points="390,295 415,295" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="565,295 640,295" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="640" y="266" width="290" height="58" rx="12" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.6"/><text x="785" y="299.5" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="785" dy="0">REVIEW_REQUIRED</tspan></text>
<rect x="30" y="338" width="360" height="58" rx="12" fill="#212925" stroke="#3b4740" stroke-width="1.6"/>
<text x="46" y="373" font-size="14.5" font-weight="400" fill="#f3efe6" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="46" dy="0">exit 0, passed above 0, failed 0, trusted source</tspan></text>
<rect x="415" y="353" width="150" height="28" rx="14" fill="#12301d" stroke="#86efac" stroke-width="1.4"/><text x="490" y="371.9" font-size="14" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="490" dy="0">passing</tspan></text>
<polyline points="390,367 415,367" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="565,367 640,367" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="640" y="338" width="290" height="58" rx="12" fill="#12301d" stroke="#86efac" stroke-width="1.6"/><text x="785" y="371.5" font-size="15" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="785" dy="0">Counts toward READY</tspan></text>
<text x="480" y="412" font-size="12.5" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">Other checks (no blocking finding, complete scan, tests, CI, license) still apply to the last row.</tspan></text>
</svg>
