<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Trust boundaries</title><desc id="d">Untrusted project files, file names, comments and evidence text flow into the CLI, which only reads and matches text and never executes it. Reports escape every value.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e584e"/></marker></defs>
<rect x="1" y="1" width="958" height="418" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<rect x="20" y="20" width="270" height="320" rx="14" fill="#fee2e2" stroke="#991b1b" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="155" y="48" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">UNTRUSTED INPUT</tspan></text>
<rect x="40" y="65" width="230" height="55" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="155" y="97.3" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">Project files</tspan></text>
<rect x="40" y="135" width="230" height="55" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="155" y="167.29999999999998" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">File names and paths</tspan></text>
<rect x="40" y="205" width="230" height="55" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="155" y="237.29999999999998" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">Comments and test text</tspan></text>
<rect x="40" y="275" width="230" height="55" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="155" y="307.3" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="155" dy="0">Evidence JSON text</tspan></text>
<rect x="345" y="20" width="270" height="320" rx="14" fill="#dff0ee" stroke="#0b5f63" stroke-width="1.6"/>
<text x="480" y="48" font-size="13" font-weight="700" fill="#0f3d3e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">TRUSTED ENGINE</tspan></text>
<rect x="365" y="70" width="230" height="250" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="480" y="147.14999999999998" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">pramanasutra CLI</tspan></text><text x="480" y="167.95" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">reads text and matches rules</tspan><tspan x="480" dy="17.6">validates the JSON shape</tspan><tspan x="480" dy="17.6">skips symbolic links</tspan><tspan x="480" dy="17.6">never executes project code</tspan><tspan x="480" dy="17.6">makes no network call</tspan><tspan x="480" dy="17.6">writes only the report folder</tspan></text>
<rect x="670" y="20" width="270" height="320" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/>
<text x="805" y="48" font-size="13" font-weight="700" fill="#166534" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">OUTPUT</tspan></text>
<rect x="690" y="70" width="230" height="120" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="805" y="117.25" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">Reports</tspan></text><text x="805" y="138.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">every value is escaped</tspan><tspan x="805" dy="17.6">in HTML and Markdown</tspan></text>
<rect x="690" y="210" width="230" height="110" rx="12" fill="#ffffff" stroke="#cfc6b4" stroke-width="1.6"/><text x="805" y="261.025" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">Exit code</tspan></text><text x="805" y="281.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="805" dy="0">0, 2 or 3 for a pipeline</tspan></text>
<polyline points="290,180 345,180" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/><text x="318" y="168" font-size="13" font-weight="700" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="318" dy="0">read only</tspan></text>
<polyline points="615,130 670,130" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="615,260 670,260" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="360" width="920" height="48" rx="12" fill="#fef3c7" stroke="#92400e" stroke-width="1.6"/><text x="480" y="388.34999999999997" font-size="14.5" font-weight="700" fill="#92400e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">Provenance of evidence is claimed, not proven. A person must still decide whether to trust the source.</tspan></text>
</svg>
