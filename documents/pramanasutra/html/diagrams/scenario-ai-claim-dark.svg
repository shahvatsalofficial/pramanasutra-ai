<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Scenario: &quot;all tests pass&quot; is a claim, not evidence</title><desc id="d">Without an evidence file from a real run the gate returns REVIEW_REQUIRED. With passing evidence it can reach READY_FOR_HUMAN_APPROVAL.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3bba9"/></marker></defs>
<rect x="1" y="1" width="958" height="358" rx="16" fill="#1a201d" stroke="#3b4740" stroke-width="2"/>
<rect x="20" y="120" width="210" height="100" rx="12" fill="#26302c" stroke="#3b4740" stroke-width="1.6"/><text x="125" y="165.725" font-size="15" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="125" dy="0">An assistant says</tspan></text><text x="125" y="185.225" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="125" dy="0">&quot;All tests pass.&quot;</tspan></text>
<polyline points="230,170 290,170" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<polygon points="405,105 520,170 405,235 290,170" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="405" y="168" font-size="16" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="405" dy="0">Evidence file?</tspan></text><text x="405" y="188" font-size="12.5" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="405" dy="0">from a real run</tspan></text>
<polyline points="405,105 405,70 560,70" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="62" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="440" dy="0">no</tspan></text>
<rect x="560" y="30" width="380" height="80" rx="12" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.6"/><text x="750" y="56.95" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="750" dy="0">REVIEW_REQUIRED (exit 3)</tspan></text><text x="750" y="76.45" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="750" dy="0">a claim is not evidence</tspan><tspan x="750" dy="17.6">run the tests, then supply the result</tspan></text>
<polyline points="405,235 405,290 560,290" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#ah)"/><text x="440" y="282" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="440" dy="0">yes</tspan></text>
<rect x="560" y="150" width="380" height="120" rx="12" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="750" y="196.95" font-size="15" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="750" dy="0">Evidence: ci-ingested</tspan></text><text x="750" y="216.45" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="750" dy="0">exit 0, passed 12, failed 0</tspan><tspan x="750" dy="17.6">verify checks the JSON shape</tspan></text>
<polyline points="750,270 750,295" fill="none" stroke="#c3bba9" stroke-width="2" marker-end="url(#ah)"/>
<rect x="560" y="295" width="380" height="55" rx="12" fill="#12301d" stroke="#86efac" stroke-width="1.6"/><text x="750" y="327" font-size="15" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="750" dy="0">READY_FOR_HUMAN_APPROVAL (exit 0)</tspan></text>
</svg>
