<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">A pull request through CI to a human decision</title><desc id="d">A pull request runs the tests on Ubuntu and Windows across Node 20, 22 and 24. A real evidence file is written from the test output, release-check runs, reports are kept, and a person reviews before release.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e584e"/></marker></defs>
<rect x="1" y="1" width="958" height="338" rx="16" fill="#fffdf8" stroke="#cfc6b4" stroke-width="2"/>
<rect x="20" y="40" width="205" height="100" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/><text x="122.5" y="86.025" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" dy="0">1  Pull request</tspan></text><text x="122.5" y="106.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" dy="0">code and tests change</tspan></text>
<rect x="262" y="40" width="205" height="100" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="364.5" y="77.25" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="364.5" dy="0">2  Real tests run</tspan></text><text x="364.5" y="98.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="364.5" dy="0">Ubuntu and Windows</tspan><tspan x="364.5" dy="17.6">Node 20, 22, 24</tspan></text>
<rect x="504" y="40" width="205" height="100" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.6"/><text x="606.5" y="77.25" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="606.5" dy="0">3  Evidence written</tspan></text><text x="606.5" y="98.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="606.5" dy="0">from the real output</tspan><tspan x="606.5" dy="17.6">scripts/ci-gate.mjs</tspan></text>
<rect x="746" y="40" width="195" height="100" rx="12" fill="#dff0ee" stroke="#0b5f63" stroke-width="1.6"/><text x="843.5" y="77.25" font-size="16" font-weight="700" fill="#0f3d3e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="843.5" dy="0">4  release-check</tspan></text><text x="843.5" y="98.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="843.5" dy="0">scan + gate</tspan><tspan x="843.5" dy="17.6">exit 0, 2 or 3</tspan></text>
<polyline points="225,90 262,90" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="467,90 504,90" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="709,90 746,90" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="843,140 843,175 122,175 122,210" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="20" y="210" width="205" height="100" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/><text x="122.5" y="247.25" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" dy="0">5  Reports kept</tspan></text><text x="122.5" y="268.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="122.5" dy="0">md, html, json, sarif</tspan><tspan x="122.5" dy="17.6">as CI artifacts</tspan></text>
<rect x="262" y="210" width="205" height="100" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="364.5" y="247.25" font-size="16" font-weight="700" fill="#166534" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="364.5" dy="0">6  Human review</tspan></text><text x="364.5" y="268.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="364.5" dy="0">read report.html</tspan><tspan x="364.5" dy="17.6">decide</tspan></text>
<rect x="504" y="210" width="205" height="100" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.6"/><text x="606.5" y="256.025" font-size="16" font-weight="700" fill="#166534" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="606.5" dy="0">7  Merge or release</tspan></text><text x="606.5" y="276.825" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="606.5" dy="0">a person clicks it</tspan></text>
<rect x="746" y="210" width="195" height="100" rx="12" fill="#efeae0" stroke="#cfc6b4" stroke-width="1.6"/><text x="843.5" y="247.25" font-size="16" font-weight="700" fill="#1c1915" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="843.5" dy="0">8  Publish</tspan></text><text x="843.5" y="268.05" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="843.5" dy="0">npm, GitHub release</tspan><tspan x="843.5" dy="17.6">after a person says go</tspan></text>
<polyline points="225,260 262,260" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="467,260 504,260" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="709,260 746,260" fill="none" stroke="#5e584e" stroke-width="2" marker-end="url(#ah)"/>
<text x="480" y="330" font-size="13" font-weight="400" fill="#5e584e" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">A red step 4 (exit 2 or 3) stops here. Nothing is released by the tool.</tspan></text>
</svg>
