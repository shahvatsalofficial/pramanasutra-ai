<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">The 17 agent skills</title><desc id="d">PramanaSutra Prime is the chief orchestrator. Sixteen specialist skills are grouped into plan, write tests, investigate, and ship and verify.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3bba9"/></marker></defs>
<rect x="1" y="1" width="958" height="518" rx="16" fill="#1a201d" stroke="#3b4740" stroke-width="2"/>
<rect x="335" y="215" width="290" height="90" rx="12" fill="#173735" stroke="#5fb9b2" stroke-width="1.6"/><text x="480" y="247.85" font-size="18" font-weight="700" fill="#a8e3dc" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">pramanasutra-prime</tspan></text><text x="480" y="271.25" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="480" dy="0">chief orchestrator</tspan><tspan x="480" dy="17.6">scope, safety, delegation</tspan></text>
<rect x="30" y="20" width="400" height="150" rx="12" fill="#16274a" stroke="#9db9ff" stroke-width="1.6"/><text x="230" y="73.475" font-size="16" font-weight="700" fill="#9db9ff" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">Plan</tspan></text><text x="230" y="94.27499999999999" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">pramanasutra-strategy</tspan><tspan x="230" dy="17.6">risk-based test strategy</tspan><tspan x="230" dy="17.6">coverage objectives</tspan></text>
<rect x="530" y="20" width="400" height="150" rx="12" fill="#12301d" stroke="#86efac" stroke-width="1.6"/><text x="730" y="73.475" font-size="16" font-weight="700" fill="#86efac" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">Write and design tests</tspan></text><text x="730" y="94.27499999999999" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">-unit  -flow  -api  -visual</tspan><tspan x="730" dy="17.6">-access  -load  -data</tspan><tspan x="730" dy="17.6">one skill per kind of test</tspan></text>
<rect x="30" y="350" width="400" height="150" rx="12" fill="#3a2f10" stroke="#fbbf24" stroke-width="1.6"/><text x="230" y="403.47499999999997" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">Investigate</tspan></text><text x="230" y="424.275" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="230" dy="0">-regression  what changed</tspan><tspan x="230" dy="17.6">-flake  why it is unstable</tspan><tspan x="230" dy="17.6">-defect  failure to bug report</tspan></text>
<rect x="530" y="350" width="400" height="150" rx="12" fill="#26302c" stroke="#3b4740" stroke-width="1.6"/><text x="730" y="403.47499999999997" font-size="16" font-weight="700" fill="#f3efe6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">Ship and verify</tspan></text><text x="730" y="424.275" font-size="13" font-weight="400" fill="#c3bba9" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><tspan x="730" dy="0">-pipeline  -release  -secure</tspan><tspan x="730" dy="17.6">-evidence  -verify</tspan><tspan x="730" dy="17.6">verify reviews the evidence</tspan></text>
